<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AI Voice Agent</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="navbar">
    <div class="navbar-brand" id="brand-icon">AI Voice Agent</div>
    <nav class="navbar-links">
      <a href="/" class="nav-link active" id="nav-chat">Chat</a>
      <a href="/dashboard.html" class="nav-link" id="nav-dashboard">Dashboard</a>
    </nav>
  </header>

  <main class="page chat-page">
    <div class="card chat-card">
      <div class="agent-tabs" id="agent-tabs">
        <button type="button" class="agent-tab active" data-agent="assistant">Personal Assistant</button>
        <button type="button" class="agent-tab" data-agent="sales">Sales Agent</button>
      </div>

      <div id="chat"></div>

      <form id="chat-form">
        <input id="chat-input" type="text" placeholder="Type a message..." autocomplete="off" />
        <button type="button" class="btn btn-icon" id="record-btn"></button>
        <button type="submit" class="btn btn-primary" id="send-btn"></button>
      </form>
    </div>
  </main>

  <script src="icons.js"></script>
  <script>
    document.getElementById("brand-icon").innerHTML = icon("phone-call") + " AI Voice Agent";
    document.getElementById("nav-chat").innerHTML = icon("message-square") + " Chat";
    document.getElementById("nav-dashboard").innerHTML = icon("layout-dashboard") + " Dashboard";
    document.getElementById("record-btn").innerHTML = icon("mic");
    document.getElementById("send-btn").innerHTML = icon("send") + " Send";

    const chat = document.getElementById("chat");
    const form = document.getElementById("chat-form");
    const input = document.getElementById("chat-input");
    const recordBtn = document.getElementById("record-btn");
    const agentTabs = document.getElementById("agent-tabs");

    let currentAgent = "assistant";
    agentTabs.addEventListener("click", (e) => {
      const btn = e.target.closest(".agent-tab");
      if (!btn) return;
      currentAgent = btn.dataset.agent;
      agentTabs.querySelectorAll(".agent-tab").forEach((t) => t.classList.toggle("active", t === btn));
    });

    let mediaRecorder = null;
    let audioChunks = [];

    recordBtn.addEventListener("click", async () => {
      if (mediaRecorder && mediaRecorder.state === "recording") {
        mediaRecorder.stop();
        return;
      }

      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream);
      audioChunks = [];

      mediaRecorder.addEventListener("dataavailable", (e) => audioChunks.push(e.data));
      mediaRecorder.addEventListener("stop", async () => {
        stream.getTracks().forEach((track) => track.stop());
        recordBtn.classList.remove("recording");
        recordBtn.innerHTML = icon("mic");

        const audioBlob = new Blob(audioChunks, { type: "audio/webm" });
        if (audioBlob.size === 0) {
          return;
        }
        const formData = new FormData();
        formData.append("audio", audioBlob, "recording.webm");

        recordBtn.disabled = true;
        try {
          const res = await fetch("/api/stt", { method: "POST", body: formData });
          const data = await res.json();
          if (data.text) {
            await sendMessage(data.text);
          } else {
            addMessage("ai", "Sorry, I didn't catch that. Could you repeat?");
          }
        } catch (err) {
          addMessage("ai", "Sorry, I didn't catch that. Could you repeat?");
        } finally {
          recordBtn.disabled = false;
        }
      });

      mediaRecorder.start();
      recordBtn.classList.add("recording");
      recordBtn.innerHTML = icon("x");
    });

    function addMessage(role, text) {
      const div = document.createElement("div");
      div.className = "msg " + role;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const message = input.value.trim();
      if (!message) return;
      input.value = "";
      sendMessage(message);
    });

    async function sendMessage(message) {
      addMessage("user", message);
      const endpoint = currentAgent === "sales" ? "/api/sales/chat" : "/api/chat";
      try {
        const res = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message }),
        });
        const data = await res.json();
        addMessage("ai", data.reply);
        await speak(data.reply);
      } catch (err) {
        addMessage("ai", "Sorry, something went wrong.");
      }
    }

    async function speak(text) {
      try {
        const res = await fetch("/api/tts", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text }),
        });
        const audioBlob = await res.blob();
        const audio = new Audio(URL.createObjectURL(audioBlob));
        audio.play();
      } catch (err) {
        console.error("TTS playback failed", err);
      }
    }
  </script>
</body>
</html>
