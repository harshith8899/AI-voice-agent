<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>AI Voice Agent</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>AI Voice Agent</h1>
  <label for="agent-select">Agent:</label>
  <select id="agent-select">
    <option value="assistant">Personal Assistant</option>
    <option value="sales">Sales Agent</option>
  </select>
  <div id="chat"></div>
  <form id="chat-form">
    <input id="chat-input" type="text" placeholder="Type a message..." autocomplete="off" />
    <button type="submit">Send</button>
    <button type="button" id="record-btn">🎤</button>
  </form>

  <script>
    const chat = document.getElementById("chat");
    const form = document.getElementById("chat-form");
    const input = document.getElementById("chat-input");
    const recordBtn = document.getElementById("record-btn");
    const agentSelect = document.getElementById("agent-select");

    let mediaRecorder = null;
    let audioChunks = [];

    recordBtn.addEventListener("click", async () => {
      if (mediaRecorder && mediaRecorder.state === "recording") {
        mediaRecorder.stop();
        return;
      }

      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream);
      audioChunks = [];

      mediaRecorder.addEventListener("dataavailable", (e) => audioChunks.push(e.data));
      mediaRecorder.addEventListener("stop", async () => {
        stream.getTracks().forEach((track) => track.stop());
        recordBtn.textContent = "🎤";

        const audioBlob = new Blob(audioChunks, { type: "audio/webm" });
        const formData = new FormData();
        formData.append("audio", audioBlob, "recording.webm");

        recordBtn.disabled = true;
        try {
          const res = await fetch("/api/stt", { method: "POST", body: formData });
          const data = await res.json();
          if (data.text) {
            await sendMessage(data.text);
          }
        } catch (err) {
          addMessage("ai", "Sorry, transcription failed.");
        } finally {
          recordBtn.disabled = false;
        }
      });

      mediaRecorder.start();
      recordBtn.textContent = "⏹";
    });

    function addMessage(role, text) {
      const div = document.createElement("div");
      div.className = "msg " + role;
      div.textContent = (role === "user" ? "You: " : "AI: ") + text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const message = input.value.trim();
      if (!message) return;
      input.value = "";
      sendMessage(message);
    });

    async function sendMessage(message) {
      addMessage("user", message);
      const endpoint = agentSelect.value === "sales" ? "/api/sales/chat" : "/api/chat";
      try {
        const res = await fetch(endpoint, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message }),
        });
        const data = await res.json();
        addMessage("ai", data.reply);
        await speak(data.reply);
      } catch (err) {
        addMessage("ai", "Sorry, something went wrong.");
      }
    }

    async function speak(text) {
      try {
        const res = await fetch("/api/tts", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text }),
        });
        const audioBlob = await res.blob();
        const audio = new Audio(URL.createObjectURL(audioBlob));
        audio.play();
      } catch (err) {
        console.error("TTS playback failed", err);
      }
    }
  </script>
</body>
</html>
